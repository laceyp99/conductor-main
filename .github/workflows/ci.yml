name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Ruff format
        run: uv run --locked --extra dev ruff format --check .
      - name: Ruff lint
        run: uv run --locked --extra dev ruff check .
      - name: Test
        run: uv run --locked --extra dev pytest -q
      - name: Build
        run: uv build

  windows-security:
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install package
        run: uv sync --locked --extra dev
      - name: Verify Gradio path traversal protection
        run: uv run --locked --extra dev pytest -q tests/test_security.py
