[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-main"
version = "0.1.0"
description = "Gradio client for Conductor Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "conductor-core[providers,playback] @ git+https://github.com/laceyp99/conductor-core.git@v0.5.1",
    "gradio==6.20.0",
    "mido==1.3.3",
    "plotly==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff==0.16.2",
]
docs = [
    "mkdocs-material>=9.6,<10",
]

[project.scripts]
conductor-main = "conductor_main.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FLY",
    "FURB",
    "I",
    "N",
    "NPY",
    "PERF",
    "PGH",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "UP",
    "W605",
]
